<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal player</title>
<style>
/* Old-webOS-safe CSS: no custom properties, no flex gap, no inset shorthand. */
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;color:#f1f1f1;font:24px/1.4 Roboto,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:fixed;top:0;left:0;width:100%;height:100%;overflow:hidden}
#stage img,#stage video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:fill;border:0}

.mark{display:inline-block;position:relative;width:64px;height:64px;border-radius:18px;background:#e50914;background:linear-gradient(145deg,#ff2a4f,#d4000f);box-shadow:0 6px 24px rgba(229,9,20,.4)}
.mark:before{content:"";position:absolute;left:26px;top:26px;width:12px;height:12px;border-radius:50%;background:#fff}
.mark:after{content:"";position:absolute;left:14px;top:14px;width:30px;height:30px;border-radius:50%;border:3px solid #fff;border-left-color:transparent;border-right-color:transparent;-webkit-transform:rotate(90deg);transform:rotate(90deg)}

/* Status / fallback screen */
#fallback{position:absolute;top:0;left:0;right:0;bottom:0;z-index:2;text-align:center;background:#0f0f0f;background:radial-gradient(ellipse at 50% 40%,#1f1f1f 0,#0f0f0f 70%)}
#fallback .center{position:absolute;left:0;right:0;top:50%;-webkit-transform:translateY(-50%);transform:translateY(-50%);padding:0 40px}
#fallback-text{display:block;margin-top:28px;font-size:30px;font-weight:500;color:#f1f1f1}
#fallback-sub{display:block;margin-top:10px;font-size:20px;color:#aaa}
.spinner{display:none;width:44px;height:44px;margin:28px auto 0;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:#ff0033;-webkit-animation:spin .9s linear infinite;animation:spin .9s linear infinite}
#fallback.busy .spinner{display:block}
@-webkit-keyframes spin{to{-webkit-transform:rotate(360deg)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* Pairing */
#enroll{display:none;position:absolute;top:0;left:0;right:0;bottom:0;z-index:4;margin:0;background:#0f0f0f;background:radial-gradient(ellipse at 50% 0,#2a0a0d 0,#0f0f0f 60%)}
#enroll .card{position:absolute;left:50%;top:50%;width:720px;max-width:90%;-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%);padding:56px 56px 44px;background:#181818;border:1px solid #2e2e2e;border-radius:28px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.6);box-sizing:border-box}
#enroll h1{margin:28px 0 8px;font-size:44px;font-weight:700;letter-spacing:-.5px}
#enroll p{margin:0;color:#aaa;font-size:22px}
#enroll .screen-id{display:inline-block;margin-top:18px;padding:6px 16px;border-radius:999px;background:#272727;color:#f1f1f1;font-size:20px}
#code{display:block;width:100%;box-sizing:border-box;margin:36px 0 20px;padding:18px 20px;background:#0f0f0f;border:2px solid #3f3f3f;border-radius:16px;color:#fff;font:700 44px/1.2 Consolas,"Courier New",monospace;letter-spacing:12px;text-align:center;text-transform:uppercase;outline:none;-webkit-transition:border-color .15s,box-shadow .15s;transition:border-color .15s,box-shadow .15s}
#code:focus{border-color:#3ea6ff;box-shadow:0 0 0 4px rgba(62,166,255,.3)}
.tv-btn{display:block;width:100%;padding:18px 24px;border:0;border-radius:999px;background:#e50914;color:#fff;font:600 26px/1.2 Roboto,"Segoe UI",Arial,sans-serif;cursor:pointer;outline:none;-webkit-transition:background-color .15s,box-shadow .15s,-webkit-transform .1s;transition:background-color .15s,box-shadow .15s,transform .1s}
.tv-btn:hover{background:#f6121d}
.tv-btn:focus{box-shadow:0 0 0 4px #000,0 0 0 8px #fff}
.tv-btn:active{background:#c80712;-webkit-transform:scale(.98);transform:scale(.98)}
.tv-btn[disabled]{opacity:.5}
#message{min-height:32px;margin-top:18px!important;color:#ff6b63!important;font-size:22px}

/* Start (autoplay blocked) — big red play button */
#start{position:absolute;z-index:3;left:50%;top:50%;width:auto;margin:0;padding:0;border:0;background:none;color:#fff;font:500 26px Roboto,"Segoe UI",Arial,sans-serif;text-align:center;cursor:pointer;display:none;-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%);outline:none}
#start .big-play{display:block;position:relative;width:120px;height:120px;margin:0 auto 22px;border-radius:50%;box-shadow:0 8px 30px rgba(0,0,0,.5);background:rgba(33,33,33,.85);-webkit-transition:background-color .15s,-webkit-transform .15s;transition:background-color .15s,transform .15s}
#start .big-play:after{content:"";position:absolute;left:48px;top:42px;border-style:solid;border-width:18px 0 18px 30px;border-color:transparent transparent transparent #fff}
#start:hover .big-play,#start:focus .big-play{background:#e50914;-webkit-transform:scale(1.06);transform:scale(1.06)}
#start:focus .label{text-decoration:underline}
#start .label{display:inline-block;padding:8px 18px;border-radius:999px;background:rgba(0,0,0,.6)}

/* Preview chrome (dashboard preview only) */
#chrome{display:none;position:absolute;left:0;right:0;bottom:0;z-index:5;padding:60px 24px 14px;background:-webkit-linear-gradient(top,rgba(0,0,0,0),rgba(0,0,0,.78));background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.78));font-size:16px;-webkit-transition:opacity .25s;transition:opacity .25s}
body.preview #chrome{display:block}
body.preview.idle #chrome{opacity:0}
#bar{position:relative;height:4px;margin-bottom:12px;background:rgba(255,255,255,.25);border-radius:2px;overflow:hidden}
#bar-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#ff0033;-webkit-transition:width .25s linear;transition:width .25s linear}
#chrome-row{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;-webkit-align-items:center;align-items:center}
#chrome-title{-webkit-box-flex:1;-webkit-flex:1;flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:500}
#chrome-time{margin-left:16px;color:#ddd;font-variant-numeric:tabular-nums}
#chrome-index{margin-left:16px;padding:2px 10px;border-radius:4px;background:rgba(255,255,255,.15);font-size:14px}
#badge{display:none;position:absolute;z-index:5;top:16px;left:16px;padding:4px 10px;border-radius:4px;background:#ff0033;color:#fff;font:600 14px/1.4 Roboto,"Segoe UI",Arial,sans-serif;letter-spacing:.6px}
body.preview #badge{display:block}

#keepawake{position:fixed;right:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none;z-index:1;border:0}
#diagnostics{position:absolute;z-index:10;background:rgba(15,15,15,.94);border:1px solid #333;border-radius:12px;top:16px;left:16px;max-width:90%;margin:0;white-space:pre-wrap;font:16px/1.5 Consolas,monospace;color:#e6e6e6;padding:20px;display:none}
</style></head><body>
<div id="stage"></div>
<div id="fallback" class="busy"><div class="center"><span class="mark"></span><span id="fallback-text">Connecting to your display…</span><span id="fallback-sub"></span><div class="spinner"></div></div></div>
<form id="enroll"><div class="card"><span class="mark"></span><h1>Pair this display</h1><p>Generate a pairing code in the administrator dashboard, then enter it below.</p><span class="screen-id" id="screen-id"></span><input id="code" aria-label="Pairing code" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="10" placeholder="CODE"><button class="tv-btn" id="pair-btn">Pair screen</button><p id="message" role="alert"></p></div></form>
<button id="start" aria-label="Press OK to start playback"><span class="big-play"></span><span class="label">Press OK to start playback</span></button>
<div id="badge">PREVIEW</div>
<div id="chrome" aria-hidden="true"><div id="bar"><div id="bar-fill"></div></div><div id="chrome-row"><span id="chrome-title"></span><span id="chrome-time"></span><span id="chrome-index"></span></div></div>
<pre id="diagnostics"></pre>
<script src="/player/player.js"></script></body></html>
